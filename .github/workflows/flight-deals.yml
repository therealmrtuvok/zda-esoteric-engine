name: Flight deals

on:
  schedule:
    - cron: "17 13 * * *"   # once a day, 13:17 UTC (8:17 am Toronto)
  workflow_dispatch: {}     # "Run workflow" button for a manual check
  push:                     # re-check right away when the watcher or its config changes
    paths:
      - "flight_deals/**"
      - ".github/workflows/flight-deals.yml"

concurrency:
  group: flight-deals
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest -b flight_deals/test_deals.py

      # Remember what was already pushed, so each find is sent once.
      - name: Restore alert history
        uses: actions/cache/restore@v4
        with:
          path: flight_deals/state.json
          key: flight-deals-state-${{ github.run_id }}
          restore-keys: flight-deals-state-

      # Each source runs only if its secret is set (feeds need none). Without
      # NTFY_TOPIC, finds are printed in this log instead of pushed.
      - name: Check for deals
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python flight_deals/deals.py

      - name: Save alert history
        if: always() && hashFiles('flight_deals/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: flight_deals/state.json
          key: flight-deals-state-${{ github.run_id }}
