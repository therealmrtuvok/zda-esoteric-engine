# Flight deal watcher config: Toronto, New Year's 2026-27.

[trip]
depart = ["2026-12-27", "2026-12-30"]  # earliest and latest day to leave
return = ["2027-01-02", "2027-01-04"]  # earliest and latest day to come back
max_price = 1500                       # budget: anything at or under this gets shown
currency = "CAD"
adults = 1
# Exact date pairs for live Google Flights searches. Each run uses ONE pair,
# rotating daily, for every origin and region: 2 origins x 3 regions = 6
# searches a day (about 180 a month), and each pair is covered every 2 days.
google_trips = [
  ["2026-12-27", "2027-01-03"],
  ["2026-12-30", "2027-01-03"],
]

# Where you can fly from. The first one is home: deal sites that only post
# fares from your city (from_origin_only feeds) are attributed to it.
[[origins]]
name = "Toronto"
airports = "YYZ,YTZ"              # Google Flights: Pearson + Billy Bishop
city = "YTO"                      # Travelpayouts: all Toronto airports
keywords = ["Toronto", "YYZ", "YTZ", "Pearson", "Billy Bishop"]

[[origins]]
name = "Buffalo"
airports = "BUF"
city = "BUF"
keywords = ["Buffalo", "BUF"]
# Added to every Buffalo fare before comparing it with the budget, deal marks
# and Toronto fares: about CA$40 gas there and back plus a week of airport
# parking. Raise it if the border wait or a hotel night matters to you.
# You'll need a passport, and US fares are converted to CAD.
extra_cost = 150

[settings]
max_searches_per_run = 6     # hard cap on SerpApi searches per run
realert_drop_pct = 10        # re-push a fare only if it gets this % cheaper
max_individual_alerts = 5    # deals and sale posts get their own push; the rest go in one digest
feed_max_age_days = 3        # ignore deal-site posts older than this
daily_summary = true         # quiet daily "nothing new, cheapest per region" push

# deal_price: at or under this a fare is flagged DEAL (an unusually good price for
#   New Year's week). Between deal_price and max_price it's still shown as an option.
# airports: up to 7 destinations Google Flights searches in one go for the region.
# countries: ISO codes, used to sort Travelpayouts fares to anywhere into regions.
# keywords: place names that tie a deal-site post to the region.

[[regions]]
name = "Caribbean & Mexico"
deal_price = 700
airports = "CUN,PUJ,MBJ,SJD,PVR,VRA,AUA"
countries = ["MX", "DO", "JM", "CU", "BS", "BB", "AW", "CW", "BQ", "SX", "MF", "PR", "VI", "VG",
             "TC", "KY", "LC", "AG", "KN", "DM", "GD", "VC", "TT", "HT", "BM", "GP", "MQ", "AI"]
keywords = ["Caribbean", "Mexico", "Cancun", "Cancún", "Riviera Maya", "Puerto Vallarta", "Los Cabos",
            "Cabo", "Cozumel", "Huatulco", "Mexico City", "Punta Cana", "Dominican", "Puerto Plata",
            "Samana", "Jamaica", "Montego Bay", "Cuba", "Varadero", "Havana", "Cayo", "Holguin",
            "Bahamas", "Nassau", "Aruba", "Curacao", "Curaçao", "Barbados", "Puerto Rico", "San Juan",
            "St. Lucia", "Saint Lucia", "Antigua", "Turks", "Providenciales", "Grand Cayman", "Bermuda",
            "St. Maarten", "Sint Maarten", "Trinidad", "Grenada", "St. Kitts"]

[[regions]]
name = "Central & South America"
deal_price = 850
airports = "SJO,LIR,BOG,LIM,PTY,MDE,CTG"
countries = ["CR", "PA", "GT", "BZ", "HN", "NI", "SV", "CO", "PE", "EC", "BR", "AR", "CL", "UY",
             "PY", "BO", "VE", "GY", "SR"]
keywords = ["Costa Rica", "San Jose", "Liberia", "Panama", "Guatemala", "Belize", "Roatan",
            "Honduras", "El Salvador", "Nicaragua", "Colombia", "Bogota", "Bogotá", "Medellin",
            "Medellín", "Cartagena", "Peru", "Lima", "Cusco", "Ecuador", "Quito", "Brazil",
            "Rio de Janeiro", "Sao Paulo", "São Paulo", "Argentina", "Buenos Aires", "Chile",
            "Santiago", "Uruguay", "Montevideo", "South America", "Central America"]

[[regions]]
name = "Europe"
deal_price = 950
airports = "LIS,MAD,BCN,FCO,CDG,LHR,DUB"
countries = ["PT", "ES", "FR", "IT", "GB", "IE", "DE", "NL", "BE", "LU", "CH", "AT", "GR", "IS",
             "DK", "SE", "NO", "FI", "PL", "CZ", "HU", "HR", "SI", "SK", "RO", "BG", "MT", "CY",
             "EE", "LV", "LT", "RS", "ME", "AL", "BA", "MK", "TR"]
keywords = ["Europe", "Portugal", "Lisbon", "Porto", "Azores", "Ponta Delgada", "Spain", "Madrid",
            "Barcelona", "France", "Paris", "Nice", "Italy", "Rome", "Milan", "Venice", "Naples",
            "UK", "London", "Manchester", "Scotland", "Edinburgh", "Glasgow", "Ireland", "Dublin",
            "Germany", "Frankfurt", "Munich", "Berlin", "Amsterdam", "Netherlands", "Brussels",
            "Zurich", "Geneva", "Vienna", "Greece", "Athens", "Iceland", "Reykjavik", "Copenhagen",
            "Stockholm", "Oslo", "Helsinki", "Prague", "Budapest", "Warsaw", "Krakow", "Croatia",
            "Zagreb", "Split", "Dubrovnik", "Istanbul", "Turkey", "Malta"]

# Deal sites with public feeds. `url` can be the feed itself or the site's home
# page (the feed link is found automatically). Add more by copying a block; a
# broken feed is reported in the run log and skipped without affecting the others.
# Not included: YYZ Deals and Secret Flying block automated readers (checked
# Oct 2026: a 403 and a bot-check page), so subscribe to their emails instead.

[[feeds]]
name = "Flytrippers"
url = "https://flytrippers.com/feed/"

[[feeds]]
name = "The Flight Deal"
url = "https://www.theflightdeal.com/feed/"

[[feeds]]
name = "Fly4free"
url = "https://www.fly4free.com/feed/"

[[feeds]]
name = "Reddit r/flightdeals"
url = "https://www.reddit.com/r/flightdeals/.rss"
